---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: memelord-{{ .Release.Name }}
spec:
  secretName: memelord-{{ .Release.Name }}-tls
  dnsNames:
    - {{ .Values.hostname }}.{{ .Values.domain }}
  issuerRef:
    name: {{ .Values.certificate.issuerName }}
    kind: {{ .Values.certificate.issuerKind }}
